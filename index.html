<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>筋トレログ</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #232733;
    --border: #333a48;
    --text: #f2f4f8;
    --text-dim: #9aa3b2;
    --accent: #a3e635;
    --accent-dark: #65a30d;
    --danger: #f87171;
    --rec: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    min-height: 100dvh;
  }

  /* ---------- ヘッダー ---------- */
  header {
    padding: 16px 20px 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 { font-size: 20px; font-weight: 800; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  #today-date { font-size: 13px; color: var(--text-dim); }

  /* ---------- 入力フォーム ---------- */
  .input-form { padding: 8px 20px 0; }
  .field { margin-bottom: 10px; }
  .field > label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: .05em;
    margin-bottom: 5px;
  }
  /* iOS/Androidではネイティブのホイールピッカーで表示される */
  .input-form select,
  .input-form input[type="text"],
  .input-form input[type="number"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    padding: 13px 14px;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }
  .input-form select {
    /* 右端にプルダウンを示す山形アイコンを描画 */
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%239aa3b2' stroke-width='2'%3E%3Cpath d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 12px 8px;
    padding-right: 36px;
  }
  .input-form select:focus,
  .input-form input:focus { outline: 2px solid var(--accent-dark); border-color: transparent; }
  .input-form input::placeholder { color: #566072; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; margin-bottom: 10px; }

  /* 重量: 数値入力＋増減ボタン */
  .weight-row { display: flex; gap: 8px; align-items: stretch; }
  .weight-row input { flex: 1; text-align: center; min-width: 0; }
  .weight-row button {
    flex-shrink: 0;
    width: 56px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    font-variant-numeric: tabular-nums;
  }
  .weight-row button:active { background: var(--border); }
  #bodyweight-note {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    display: none;
  }

  /* 記録ボタン */
  #submit-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #10130a;
    font-size: 17px;
    font-weight: 800;
    padding: 15px 0;
    margin-top: 2px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(163, 230, 53, .25);
    touch-action: manipulation;
  }
  #submit-btn:active { transform: scale(.99); }
  #submit-btn:disabled {
    background: var(--surface-2);
    color: var(--text-dim);
    box-shadow: none;
    cursor: not-allowed;
  }

  /* ---------- メッセージ ---------- */
  #message {
    margin: 10px 20px 0;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    display: none;
  }
  #message.ok    { display: block; background: rgba(163, 230, 53, .12); color: var(--accent); border: 1px solid rgba(163, 230, 53, .35); }
  #message.error { display: block; background: rgba(248, 113, 113, .1); color: var(--danger); border: 1px solid rgba(248, 113, 113, .35); }

  /* ---------- タブ ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    margin: 14px 20px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
  }
  .tabs button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 700;
    padding: 9px 0;
    border-radius: 9px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tabs button.active { background: var(--surface-2); color: var(--accent); }

  /* ---------- 履歴の期間セレクタ ---------- */
  .scope-row { margin: 12px 20px 0; }
  .scope-row select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    padding: 11px 36px 11px 14px;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%239aa3b2' stroke-width='2'%3E%3Cpath d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 12px 8px;
    touch-action: manipulation;
  }
  .scope-row select:focus { outline: 2px solid var(--accent-dark); border-color: transparent; }

  /* ---------- サマリー ---------- */
  .summary {
    display: flex;
    gap: 10px;
    margin: 16px 20px 0;
  }
  .summary .card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: center;
  }
  .summary .card .num { font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .summary .card .lbl { font-size: 11px; color: var(--text-dim); }

  /* ---------- 記録リスト ---------- */
  .log-section { flex: 1; padding: 14px 20px 32px; }
  .log-section h2 {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: .05em;
  }
  #log-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  #log-list li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .part-badge {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    color: #10130a;
  }
  .part-胸    { background: #f472b6; }
  .part-背中  { background: #60a5fa; }
  .part-脚    { background: #fbbf24; }
  .part-肩    { background: #a78bfa; }
  .part-腕    { background: #34d399; }
  .part-腹    { background: #fb923c; }
  .part-その他 { background: #94a3b8; }
  .entry-main { flex: 1; min-width: 0; }
  .entry-main .name { font-weight: 700; font-size: 16px; }
  .entry-main .detail { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .entry-vol { text-align: right; flex-shrink: 0; }
  .entry-vol .v { font-size: 17px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .entry-vol .u { font-size: 11px; color: var(--text-dim); }
  .del-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    padding: 6px;
    cursor: pointer;
    line-height: 1;
    touch-action: manipulation;
  }
  .del-btn:active { color: var(--danger); }
  #empty-msg { color: #566072; font-size: 14px; text-align: center; padding: 24px 0; }

  /* ---------- 部位別の負荷 ---------- */
  .part-section { padding: 0 20px; margin-top: 14px; }
  .part-section h2 {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: .05em;
  }
  #part-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  #part-list li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #part-list .bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }
  #part-list .bar { height: 100%; border-radius: 3px; background: var(--accent); }
  #part-list .val {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 履歴の日付見出し ---------- */
  #log-list li.day-header {
    background: none;
    border: none;
    padding: 12px 2px 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  #log-list li.day-header .d { font-size: 15px; font-weight: 800; color: var(--accent); }
  #log-list li.day-header .s { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header>
  <h1>筋トレ<span>ログ</span></h1>
  <div id="today-date"></div>
</header>

<div class="input-form" id="input-form">
  <div class="field">
    <label for="sel-exercise">種目</label>
    <select id="sel-exercise"></select>
  </div>

  <div class="field" id="custom-field" style="display:none">
    <label for="custom-name">種目名（自由入力）</label>
    <input type="text" id="custom-name" placeholder="例：ケーブルカール" autocomplete="off">
  </div>

  <div class="field">
    <label for="input-weight">重量 (kg) ／ 0 で自重</label>
    <div class="weight-row">
      <button type="button" id="weight-minus" aria-label="重量を2.5kg減らす">−2.5</button>
      <input type="number" id="input-weight" inputmode="decimal" step="2.5" min="0" value="0">
      <button type="button" id="weight-plus" aria-label="重量を2.5kg増やす">＋2.5</button>
    </div>
    <div id="bodyweight-note">自重種目として記録します（回数×セットを集計）</div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="sel-reps">回数</label>
      <select id="sel-reps"></select>
    </div>
    <div class="field">
      <label for="sel-sets">セット数</label>
      <select id="sel-sets"></select>
    </div>
  </div>

  <button id="submit-btn">記録する</button>
</div>

<div id="message"></div>

<div class="tabs">
  <button id="tab-today" class="active">今日</button>
  <button id="tab-history">履歴</button>
</div>

<div class="scope-row" id="scope-row" style="display:none">
  <select id="sel-scope" aria-label="表示する期間"></select>
</div>

<div class="summary">
  <div class="card"><div class="num" id="sum-1">0</div><div class="lbl" id="sum-1-lbl">種目数</div></div>
  <div class="card"><div class="num" id="sum-2">0</div><div class="lbl" id="sum-2-lbl">総セット</div></div>
  <div class="card"><div class="num" id="sum-3">0</div><div class="lbl" id="sum-3-lbl">総負荷量 (kg)</div></div>
</div>

<section class="part-section" id="part-section" style="display:none">
  <h2 id="part-title">部位別の負荷</h2>
  <ul id="part-list"></ul>
</section>

<section class="log-section">
  <h2 id="log-title">今日の記録</h2>
  <ul id="log-list"></ul>
  <div id="empty-msg">まだ記録がありません。上のフォームから記録してください。</div>
</section>

<script>
"use strict";

/* ==============================
   部位判定マスタ（キーワード → 部位）
   長いキーワードを優先してマッチさせる
============================== */
const BODY_PART_MASTER = {
  // 胸
  "ベンチプレス": "胸", "インクラインベンチプレス": "胸", "インクラインプレス": "胸",
  "ダンベルプレス": "胸", "チェストプレス": "胸", "ダンベルフライ": "胸",
  "ペックフライ": "胸", "ケーブルクロスオーバー": "胸", "ディップス": "胸",
  "プッシュアップ": "胸", "腕立て伏せ": "胸", "腕立て": "胸",
  // 背中
  "デッドリフト": "背中", "ラットプルダウン": "背中", "ラットプル": "背中",
  "ベントオーバーロー": "背中", "ベントオーバーロウ": "背中",
  "シーテッドロー": "背中", "シーテッドロウ": "背中", "ワンハンドロー": "背中",
  "ワンハンドロウ": "背中", "チンニング": "背中", "懸垂": "背中",
  "プルオーバー": "背中", "バックエクステンション": "背中",
  // 脚
  "スクワット": "脚", "ブルガリアンスクワット": "脚", "フロントスクワット": "脚",
  "レッグプレス": "脚", "レッグエクステンション": "脚", "レッグカール": "脚",
  "ランジ": "脚", "カーフレイズ": "脚", "ヒップスラスト": "脚",
  "ヒップアブダクション": "脚", "ヒップアダクション": "脚",
  // 肩
  "ショルダープレス": "肩", "ミリタリープレス": "肩", "サイドレイズ": "肩",
  "フロントレイズ": "肩", "リアレイズ": "肩", "アップライトロー": "肩",
  "アップライトロウ": "肩", "フェイスプル": "肩", "シュラッグ": "肩",
  // 腕
  "アームカール": "腕", "バーベルカール": "腕", "ダンベルカール": "腕",
  "ハンマーカール": "腕", "プリチャーカール": "腕", "インクラインカール": "腕",
  "トライセプスエクステンション": "腕", "フレンチプレス": "腕",
  "スカルクラッシャー": "腕", "キックバック": "腕", "プレスダウン": "腕",
  "リストカール": "腕",
  // 腹
  "アブローラー": "腹", "クランチ": "腹", "シットアップ": "腹",
  "レッグレイズ": "腹", "プランク": "腹", "腹筋": "腹",
};
// 長い順にソートしたキー一覧（部分一致で長いものを優先）
const MASTER_KEYS = Object.keys(BODY_PART_MASTER).sort((a, b) => b.length - a.length);

function judgeBodyPart(name) {
  for (const key of MASTER_KEYS) {
    if (name.includes(key)) return BODY_PART_MASTER[key];
  }
  return "その他";
}

/* 部位ごとに種目をまとめる（プルダウンのグループ表示用。定義順を維持） */
function groupExercisesByPart() {
  const groups = new Map();
  for (const [name, part] of Object.entries(BODY_PART_MASTER)) {
    if (!groups.has(part)) groups.set(part, []);
    groups.get(part).push(name);
  }
  return groups;
}

/* ==============================
   データ保存（localStorage）
============================== */
const STORAGE_KEY = "gymLogEntries";

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function loadEntries() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

let entries = loadEntries();

/* ==============================
   表示
============================== */
const logList = document.getElementById("log-list");
const emptyMsg = document.getElementById("empty-msg");
const logTitle = document.getElementById("log-title");
const sumNums = [1, 2, 3].map(i => document.getElementById(`sum-${i}`));
const sumLbls = [1, 2, 3].map(i => document.getElementById(`sum-${i}-lbl`));

let currentView = "today"; // "today" | "history"

function setSummary(items) {
  items.forEach(([num, lbl], i) => {
    sumNums[i].textContent = num;
    sumLbls[i].textContent = lbl;
  });
}

function formatDateLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const label = `${m}/${d} (${"日月火水木金土"[dt.getDay()]})`;
  return dateStr === todayStr() ? `${label} 今日` : label;
}

function createEntryLi(e) {
  const li = document.createElement("li");

  const badge = document.createElement("span");
  badge.className = `part-badge part-${e.part}`;
  badge.textContent = e.part;

  const main = document.createElement("div");
  main.className = "entry-main";
  const nameDiv = document.createElement("div");
  nameDiv.className = "name";
  nameDiv.textContent = e.name;
  const isBodyweight = e.weight === 0;
  const detailDiv = document.createElement("div");
  detailDiv.className = "detail";
  detailDiv.textContent = isBodyweight
    ? `自重 × ${e.reps}回 × ${e.sets}セット`
    : `${e.weight}kg × ${e.reps}回 × ${e.sets}セット`;
  main.append(nameDiv, detailDiv);

  const vol = document.createElement("div");
  vol.className = "entry-vol";
  vol.innerHTML = isBodyweight
    ? `<div class="v">${(e.reps * e.sets).toLocaleString()}</div><div class="u">回 合計</div>`
    : `<div class="v">${e.volume.toLocaleString()}</div><div class="u">kg 総負荷</div>`;

  const del = document.createElement("button");
  del.className = "del-btn";
  del.setAttribute("aria-label", "削除");
  del.textContent = "×";
  del.addEventListener("click", () => {
    entries = entries.filter(x => x.id !== e.id);
    saveEntries(entries);
    render();
  });

  li.append(badge, main, vol, del);
  return li;
}

/* ---------- 部位別の負荷 ---------- */
const partSection = document.getElementById("part-section");
const partTitle = document.getElementById("part-title");
const partList = document.getElementById("part-list");

function computePartTotals(list) {
  const map = new Map();
  for (const e of list) {
    const t = map.get(e.part) || { part: e.part, volume: 0, bwReps: 0 };
    if (e.weight === 0) t.bwReps += e.reps * e.sets;
    else t.volume += e.volume;
    map.set(e.part, t);
  }
  return [...map.values()].sort((a, b) => (b.volume - a.volume) || (b.bwReps - a.bwReps));
}

function renderPartBreakdown(list, title) {
  partTitle.textContent = title;
  const totals = computePartTotals(list);
  partList.innerHTML = "";
  partSection.style.display = totals.length ? "" : "none";

  const maxVol = Math.max(1, ...totals.map(t => t.volume));
  totals.forEach(t => {
    const li = document.createElement("li");

    const badge = document.createElement("span");
    badge.className = `part-badge part-${t.part}`;
    badge.textContent = t.part;

    const barWrap = document.createElement("div");
    barWrap.className = "bar-wrap";
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.width = `${Math.round((t.volume / maxVol) * 100)}%`;
    barWrap.appendChild(bar);

    const val = document.createElement("span");
    val.className = "val";
    const parts = [];
    if (t.volume) parts.push(`${t.volume.toLocaleString()}kg`);
    if (t.bwReps) parts.push(`自重${t.bwReps.toLocaleString()}回`);
    val.textContent = parts.join(" + ");

    li.append(badge, barWrap, val);
    partList.appendChild(li);
  });
}

function render() {
  logList.innerHTML = "";
  if (currentView === "today") renderToday();
  else renderHistory();
}

function renderToday() {
  logTitle.textContent = "今日の記録";
  emptyMsg.textContent = "まだ記録がありません。上のフォームから記録してください。";
  const today = entries.filter(e => e.date === todayStr());
  emptyMsg.style.display = today.length ? "none" : "block";

  // 新しい記録を上に表示
  [...today].reverse().forEach(e => logList.appendChild(createEntryLi(e)));

  setSummary([
    [today.length, "種目数"],
    [today.reduce((s, e) => s + e.sets, 0), "総セット"],
    [today.reduce((s, e) => s + e.volume, 0).toLocaleString(), "総負荷量 (kg)"],
  ]);
  renderPartBreakdown(today, "部位別の負荷（今日）");
}

/* 履歴の表示範囲: "all"（全期間）または "YYYY-MM-DD"（1日） */
const SCOPE_ALL = "all";
let historyScope = SCOPE_ALL;
const scopeRow = document.getElementById("scope-row");
const selScope = document.getElementById("sel-scope");

function buildScopeOptions(dates) {
  selScope.innerHTML = "";
  const all = document.createElement("option");
  all.value = SCOPE_ALL;
  all.textContent = `全期間（${dates.length}日分）`;
  selScope.appendChild(all);
  for (const date of dates) {
    const opt = document.createElement("option");
    opt.value = date;
    opt.textContent = formatDateLabel(date);
    selScope.appendChild(opt);
  }
  selScope.value = historyScope;
}

selScope.addEventListener("change", () => {
  historyScope = selScope.value;
  render();
});

function renderHistory() {
  emptyMsg.textContent = "まだ記録がありません。";
  const dates = [...new Set(entries.map(e => e.date))].sort().reverse();
  // 選択中の日の記録が全部消えた場合は全期間に戻す
  if (historyScope !== SCOPE_ALL && !dates.includes(historyScope)) historyScope = SCOPE_ALL;
  buildScopeOptions(dates);

  const isAll = historyScope === SCOPE_ALL;
  const scoped = isAll ? entries : entries.filter(e => e.date === historyScope);
  const scopedDates = isAll ? dates : [historyScope];

  logTitle.textContent = isAll ? "トレーニング履歴" : `${formatDateLabel(historyScope)} の記録`;
  emptyMsg.style.display = scoped.length ? "none" : "block";

  for (const date of scopedDates) {
    const dayEntries = entries.filter(e => e.date === date);

    // 1日だけ表示しているときは見出しに日付が出ているので省略する
    if (isAll) {
      const dayVolume = dayEntries.reduce((s, e) => s + e.volume, 0);
      const parts = [...new Set(dayEntries.map(e => e.part))].join("・");
      const header = document.createElement("li");
      header.className = "day-header";
      header.innerHTML =
        `<span class="d">${formatDateLabel(date)}</span>` +
        `<span class="s">${parts} ／ 総負荷 ${dayVolume.toLocaleString()}kg</span>`;
      logList.appendChild(header);
    }

    [...dayEntries].reverse().forEach(e => logList.appendChild(createEntryLi(e)));
  }

  setSummary(isAll
    ? [
        [dates.length, "トレーニング日数"],
        [entries.length, "総記録数"],
        [entries.reduce((s, e) => s + e.volume, 0).toLocaleString(), "全期間の総負荷 (kg)"],
      ]
    : [
        [scoped.length, "種目数"],
        [scoped.reduce((s, e) => s + e.sets, 0), "総セット"],
        [scoped.reduce((s, e) => s + e.volume, 0).toLocaleString(), "総負荷量 (kg)"],
      ]);
  renderPartBreakdown(scoped, `部位別の負荷（${isAll ? "全期間" : formatDateLabel(historyScope)}）`);
}

/* ==============================
   タブ切り替え
============================== */
const tabToday = document.getElementById("tab-today");
const tabHistory = document.getElementById("tab-history");
const todayOnlyEls = [document.getElementById("input-form")];

function setView(view) {
  currentView = view;
  tabToday.classList.toggle("active", view === "today");
  tabHistory.classList.toggle("active", view === "history");
  todayOnlyEls.forEach(el => { el.style.display = view === "today" ? "" : "none"; });
  scopeRow.style.display = view === "history" ? "" : "none";
  render();
}

tabToday.addEventListener("click", () => setView("today"));
tabHistory.addEventListener("click", () => setView("history"));

/* ==============================
   記録の追加
============================== */
const messageEl = document.getElementById("message");
let messageTimer = null;

function showMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = type;
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => { messageEl.className = ""; }, 4000);
}

function addEntry({ name, weight, reps, sets }) {
  const part = judgeBodyPart(name);
  const volume = Math.round(weight * reps * sets * 10) / 10; // 総負荷量
  entries.push({
    id: Date.now() + Math.random(),
    date: todayStr(),
    name, part, weight, reps, sets, volume,
  });
  saveEntries(entries);
  render();
  const summary = weight === 0
    ? `合計 ${(reps * sets).toLocaleString()}回`
    : `総負荷 ${volume.toLocaleString()}kg`;
  showMessage(`✓ ${name}（${part}）を記録しました — ${summary}`, "ok");
}

/* ==============================
   入力フォーム
============================== */
const CUSTOM_VALUE = "__custom__";
const selExercise = document.getElementById("sel-exercise");
const selReps = document.getElementById("sel-reps");
const selSets = document.getElementById("sel-sets");
const customField = document.getElementById("custom-field");
const customName = document.getElementById("custom-name");
const inputWeight = document.getElementById("input-weight");
const bodyweightNote = document.getElementById("bodyweight-note");

/* マスタにない種目（自由入力したもの）を履歴から拾って選択肢に載せる */
function customExerciseNames() {
  const seen = [];
  for (let i = entries.length - 1; i >= 0 && seen.length < 12; i--) {
    const name = entries[i].name;
    if (!(name in BODY_PART_MASTER) && !seen.includes(name)) seen.push(name);
  }
  return seen;
}

function buildExerciseOptions() {
  const keep = selExercise.value;
  selExercise.innerHTML = "";

  // 過去に自由入力した種目を先頭に
  const customs = customExerciseNames();
  if (customs.length) {
    const group = document.createElement("optgroup");
    group.label = "最近使った種目";
    for (const name of customs) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      group.appendChild(opt);
    }
    selExercise.appendChild(group);
  }

  // 種目: 部位ごとのグループ + 自由入力
  for (const [part, names] of groupExercisesByPart()) {
    const group = document.createElement("optgroup");
    group.label = part;
    for (const name of names) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      group.appendChild(opt);
    }
    selExercise.appendChild(group);
  }
  const customOpt = document.createElement("option");
  customOpt.value = CUSTOM_VALUE;
  customOpt.textContent = "＋ その他（自由入力）";
  selExercise.appendChild(customOpt);

  if (keep) selExercise.value = keep;
}

function buildCountOptions() {
  const fill = (sel, max, unit, initial) => {
    for (let i = 1; i <= max; i++) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${i}${unit}`;
      sel.appendChild(opt);
    }
    sel.value = initial;
  };
  fill(selReps, 30, "回", 10);
  fill(selSets, 10, "セット", 3);
}

/* 同じ種目の直近の記録をフォームに復元する（多くの場合そのまま記録できる） */
function prefillFromLastRecord(name, silent) {
  const last = [...entries].reverse().find(e => e.name === name);
  if (!last) return;
  inputWeight.value = last.weight;
  if (last.reps >= 1 && last.reps <= 30) selReps.value = last.reps;
  if (last.sets >= 1 && last.sets <= 10) selSets.value = last.sets;
  updateBodyweightNote();
  if (!silent) {
    showMessage(`前回の記録を反映しました（${last.weight === 0 ? "自重" : last.weight + "kg"} × ${last.reps}回 × ${last.sets}セット）`, "ok");
  }
}

function updateBodyweightNote() {
  bodyweightNote.style.display = Number(inputWeight.value) === 0 ? "block" : "none";
}

selExercise.addEventListener("change", () => {
  const isCustom = selExercise.value === CUSTOM_VALUE;
  customField.style.display = isCustom ? "" : "none";
  if (isCustom) {
    customName.focus();
  } else {
    prefillFromLastRecord(selExercise.value);
  }
});

for (const [id, delta] of [["weight-minus", -2.5], ["weight-plus", 2.5]]) {
  document.getElementById(id).addEventListener("click", () => {
    const next = Math.max(0, (Number(inputWeight.value) || 0) + delta);
    inputWeight.value = Math.round(next * 10) / 10;
    updateBodyweightNote();
  });
}
inputWeight.addEventListener("input", updateBodyweightNote);

document.getElementById("submit-btn").addEventListener("click", () => {
  const isCustom = selExercise.value === CUSTOM_VALUE;
  const name = isCustom ? customName.value.trim() : selExercise.value;
  if (!name) {
    showMessage("⚠ 種目名を入力してください", "error");
    customName.focus();
    return;
  }
  const weight = Math.max(0, Number(inputWeight.value) || 0);
  addEntry({
    name,
    weight,
    reps: Number(selReps.value),
    sets: Number(selSets.value),
  });
  if (isCustom) {
    // 次回からプルダウンで選べるように選択肢へ追加し、そのまま選択状態にする
    customName.value = "";
    buildExerciseOptions();
    selExercise.value = name;
    customField.style.display = "none";
  }
});

/* ==============================
   初期化
============================== */
const now = new Date();
document.getElementById("today-date").textContent =
  `${now.getMonth() + 1}/${now.getDate()} (${"日月火水木金土"[now.getDay()]})`;
buildExerciseOptions();
buildCountOptions();
// 直近に記録した種目を初期選択にして、前回の重量・回数・セットを復元しておく
const lastEntry = entries.at(-1);
if (lastEntry && [...selExercise.options].some(o => o.value === lastEntry.name)) {
  selExercise.value = lastEntry.name;
}
prefillFromLastRecord(selExercise.value, true);
updateBodyweightNote();
render();
</script>
</body>
